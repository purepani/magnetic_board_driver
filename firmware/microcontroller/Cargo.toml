[package]
edition = "2024"
name = "microcontroller"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
embassy-stm32 = { version = "0.5.0",  features = [ "defmt", "stm32wba55cg", "time-driver-any", "memory-x", "exti", "time"]  }
embassy-sync = { version = "0.7.2",  features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = ["defmt", "arch-cortex-m", "executor-thread", "executor-interrupt",] }
embassy-time = { version = "0.5.0",  features = ["defmt", "defmt-timestamp-uptime" ,"tick-hz-32_768"] }
embassy-net = { version = "0.7.1",  features = ["defmt", "udp", "proto-ipv6", "medium-ieee802154", ], optional=true }
embedded-io = {version="0.7.1", default-features=false}

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
futures = { version = "0.3.31", default-features = false, features = ["async-await"] }
heapless = { version = "0.8", default-features = false }
static_cell = "2"
embedded-hal-async = {version="1.0.0", features=["defmt-03"]}
bitvec = {version="1.0.1", default-features=false}
bitflags = "2.6.0"
bitmatch = "0.1.1"
postcard = { version = "1.1.3", features=["embedded-io-06"]}
serde = { version = "1.0.215", default-features = false }
data_transfer = {path = "../../data_transfer", default-features=false}
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embassy-embedded-hal = "0.5.0"
embedded-io-async = "0.6.0"
embassy-futures = "0.1.2"
postcard-rpc = { version = "0.12.1", features = ["embedded-io-async-0_7-server"] }
portable-atomic = "1.13.1"


[profile.release]
debug = 0


